
services:

  # Object Storage - Data Lake
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: LakehouseMinioDev2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    restart: unless-stopped

  # Relational Source Database
  postgres:
    image: postgres:16-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_DB: retailpulse
      POSTGRES_USER: retailpulse_admin
      POSTGRES_PASSWORD: RetailPulseDbDev2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse_admin -d retailpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

  # Iceberg Catalog
  nessie:
    image: ghcr.io/projectnessie/nessie:0.110.0
    container_name: lakehouse-nessie
    ports:
      - "19120:19120"
    mem_limit: 768m
    restart: unless-stopped

  # SQL Query Engine
  trino:
    image: trinodb/trino:484
    container_name: lakehouse-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    env_file:
      - .env
    mem_limit: 2g
    restart: unless-stopped

  # Spark Master
  spark-master:
    image: apache/spark:3.5.6
    container_name: lakehouse-spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8081:8080"
    mem_limit: 1g
    restart: unless-stopped

  # Spark Worker
  spark-worker:
    image: apache/spark:3.5.6
    container_name: lakehouse-spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    mem_limit: 3g
    restart: unless-stopped

  airflow-db:
    image: postgres:16-alpine
    container_name: lakehouse-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_dev
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  airflow-init:
    image: retailpulse-airflow:2.10.5
    container_name: lakehouse-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_dev@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__METRICS__STATSD_ON: "True"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT_URL: http://minio:9000
      NESSIE_URI: http://nessie:19120/api/v2
      PYTHONPATH: /opt/airflow/project
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    volumes: &airflow-common-volumes
      - ../../orchestration/dags:/opt/airflow/dags
      - airflow_logs_data:/opt/airflow/logs
      - ../../orchestration/plugins:/opt/airflow/plugins
      - ../../:/opt/airflow/project
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password airflow_local_dev \
          --firstname Lakehouse \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    image: retailpulse-airflow:2.10.5
    container_name: lakehouse-airflow-webserver
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8083:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    mem_limit: 768m

  airflow-scheduler:
    image: retailpulse-airflow:2.10.5
    container_name: lakehouse-airflow-scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
    env_file:
      - .env
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler
    restart: unless-stopped
    mem_limit: 1g

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: lakehouse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - default

  grafana:
    image: grafana/grafana:11.5.2
    container_name: lakehouse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_dev
    depends_on:
      - prometheus
    networks:
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: lakehouse-cadvisor
    restart: unless-stopped
    ports:
      - "8084:8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - default

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    container_name: lakehouse-statsd-exporter
    restart: unless-stopped
    ports:
      - "9102:9102"
    expose:
      - "9125/udp"
    networks:
      - default

volumes:
  minio_data:
  postgres_data:
  airflow_db_data:
  airflow_logs_data:
  prometheus_data:
  grafana_data: